# Continuous integration for the course labs (lesson 7.4).
# On every push and pull request:
#   compile     every Python file in the repo byte-compiles (catches syntax errors in M1 and M2,
#               whose checks need live services)
#   selftest    each module's offline self-test (Modules 3-8, 10, 11): the lab check runs end to end
#               against a scripted stand-in for the model (MNN_FAKE_LLM=1), so no Ollama, GPU
#               or API key is needed. It proves the plumbing and the APIs, not answer quality.
#   manifests   m07/k8s/*.yaml validated against the Kubernetes API schemas with kubeconform
#   prometheus  m08's Prometheus config and alert rules checked with promtool (lesson 8.1)
# A red cross on a commit means one of these failed; the log of the failed step says which check.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q setup m01 m02 m03 m04 m05 m06 m07 m08 m10 m11

  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: m03
            run: M03_FAKE_LLM=1 python m03/check.py
          - module: m04
            run: M04_FAKE_LLM=1 python m04/check.py
          - module: m05
            run: M05_FAKE_LLM=1 python m05/check.py --aws
          - module: m06
            run: M06_FAKE_LLM=1 python m06/check.py
          - module: m07
            run: M07_FAKE_LLM=1 python m07/check.py
          - module: m08
            run: M08_FAKE_LLM=1 python m08/check.py
          - module: m10
            run: M10_FAKE_LLM=1 python m10/check.py
          - module: m11
            run: M11_FAKE_LLM=1 python m11/check.py
    name: selftest ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - name: Install the module's pinned packages
        run: |
          if [ "${{ matrix.module }}" = "m10" ] || [ "${{ matrix.module }}" = "m11" ]; then
            # m10 (and m11, which runs the m10 desk) builds on m09, whose torch + transformers only serve the GPT-2 heuristics at layer L4; the
            # offline self-test runs the desk at L1, so CI installs the same pins without those two
            grep -v -E "^(torch|transformers)==" m09/requirements.txt > m09/requirements-ci.txt
            sed 's#../m09/requirements.txt#../m09/requirements-ci.txt#' m10/requirements.txt > m10/requirements-ci.txt
            python -m pip install -r m10/requirements-ci.txt
            python -m spacy download en_core_web_lg     # Presidio's model (M9's masking rails and audit log)
          else
            python -m pip install -r ${{ matrix.module }}/requirements.txt
          fi
          # the desk's NAT plugins from Modules 1-3 (lookup_order, the ticket tools, desk_memory)
          python -m pip install -e m01/support_tools -e m02/desk_tools -e m03/desk_memory
          if [ "${{ matrix.module }}" = "m06" ] || [ "${{ matrix.module }}" = "m07" ] || [ "${{ matrix.module }}" = "m08" ] || [ "${{ matrix.module }}" = "m10" ]; then
            python -m pip install --no-deps -e m06     # registers M6's NAT evaluators
          fi
      - name: Offline self-test
        run: ${{ matrix.run }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/state/*.log
            ${{ matrix.module }}/state/logs/
            ${{ matrix.module }}/state/check/*.log
          if-no-files-found: ignore

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform v0.7.0 (checksum pinned)
        run: |
          curl -sSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform
      - name: Validate m07/k8s against Kubernetes 1.33 schemas
        # -ignore-missing-schemas: NIMService is a custom resource with no public schema here;
        # m07/check.py checks its fields instead
        run: ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 m07/k8s

  prometheus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool from Prometheus v3.6.0
        run: |
          curl -sSL -o prom.tgz https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz
          echo "2002ef4a55a64161affccd2786c7081d4e3b3a8d08786a98b3bb110971414916  prom.tgz" | sha256sum -c -
          tar xzf prom.tgz --strip-components=1 prometheus-3.6.0.linux-amd64/promtool
      - name: Check m08/observability (scrape config, alert rules)
        run: ./promtool check config m08/observability/prometheus.yml
